<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a0d14">
<meta name="robots" content="noindex">
<title>YE</title>
<style>
/* VOICE: tender and private, a note left in a box
   IDEA: the last title card of the film, continued on her phone
   PICTURE: one drawn heart, the countdown or the code set large in the film's serif
   COLOUR and TYPE: deep plum night, warm white, one rose accent; Times as in the video
   LAYOUT: one centred card per view, nothing else on screen */
:root{--bg:#1a0d14;--ink:#fbf3ee;--mute:#c9b3bb;--rose:#f06292}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#3a1628 0%,var(--bg) 60%) fixed;color:var(--ink);font:18px/1.5 "Times New Roman",Times,serif;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));text-align:center;-webkit-font-smoothing:antialiased}
.view{display:none;max-width:520px;width:100%}
.view.on{display:block}
svg.heart{width:72px;height:72px;margin:0 auto 18px;display:block}
@media(prefers-reduced-motion:no-preference){svg.heart{animation:beat 1.6s ease-in-out infinite}@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}45%{transform:scale(1.08)}}}
h1{font-weight:400;font-size:clamp(34px,9vw,52px);line-height:1.05;margin:0 0 10px;text-wrap:balance}
p{margin:0 0 10px;color:var(--mute)}
#wall{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:none;touch-action:none;cursor:grab;z-index:0}
body.collage #wall{display:block}
body.collage .view{position:relative;z-index:1;pointer-events:none}
.glass{display:inline-block;padding:18px 22px;border-radius:22px;background:#1a0d1466;-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 18px 50px -20px #000c,inset 0 0 0 1px #ffffff26}
.count{display:flex;justify-content:center;align-items:baseline;gap:clamp(4px,1.6vw,10px);margin:0}
.count b{font-weight:400;font-size:clamp(46px,14vw,84px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;text-shadow:0 2px 18px #0008}
.count i{font-style:normal;font-size:clamp(30px,8vw,52px);opacity:.55;transform:translateY(-.12em)}
#v-pin h1{margin:6px 0 4px;font-size:clamp(30px,8vw,44px);text-shadow:0 2px 18px #0008}
#lb{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#0d060acc;opacity:0;pointer-events:none;transition:opacity .25s}
#lb.on{opacity:1;pointer-events:auto}
#lb img{max-width:88vw;max-height:80vh;border:10px solid #fff;border-bottom-width:34px;border-radius:3px;box-shadow:0 30px 80px #000;transform:rotate(-2deg) scale(.92);transition:transform .25s}
#lb.on img{transform:rotate(-2deg) scale(1)}
.pin{display:flex;justify-content:center;gap:12px;margin:18px 0 6px}
.pin b{font-weight:400;font-size:clamp(56px,17vw,88px);line-height:1;width:1.1em;padding:14px 0;border:1px solid #ffffff40;border-radius:14px;background:#ffffff14}
button{font:600 17px -apple-system,system-ui,sans-serif;min-height:52px;padding:0 30px;border-radius:999px;border:0;background:var(--rose);color:#fff;margin-top:18px}
button:disabled{opacity:.6}
video{width:100%;max-height:78vh;border-radius:12px;background:#000;margin-top:16px;display:none}
.bar{height:4px;background:#ffffff22;border-radius:4px;overflow:hidden;margin:18px auto 0;max-width:260px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--rose);transition:width .2s}
.small{font-size:14px}
ul.check{list-style:none;padding:0;margin:18px auto;text-align:left;max-width:300px;font:15px/1.9 -apple-system,system-ui,sans-serif;color:var(--mute)}
ul.check li.ok{color:var(--ink)}
ul.check li::before{content:"○ ";color:var(--mute)}
ul.check li.ok::before{content:"● ";color:var(--rose)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="h" viewBox="0 0 24 24"><path fill="#f06292" d="M12 21s-7.5-4.6-9.6-9.1C.9 8.6 2.8 4.5 6.6 4.5c2.3 0 3.8 1.3 5.4 3.2 1.6-1.9 3.1-3.2 5.4-3.2 3.8 0 5.7 4.1 4.2 7.4C19.5 16.4 12 21 12 21z"/></symbol></defs></svg>

<section class="view" id="v-home">
  <svg class="heart"><use href="#h"/></svg>
  <h1>Nothing here yet</h1>
  <p>Scan the code on the box.</p>
</section>

<canvas id="wall" aria-hidden="true"></canvas>
<div id="lb" aria-hidden="true"><img id="lbimg" alt=""></div>

<section class="view" id="v-wait">
  <div class="glass"><div class="count" id="count"></div></div>
</section>

<section class="view" id="v-pin">
  <div class="glass">
    <h1>Happy anniversary</h1>
    <div class="pin" id="pin"></div>
  </div>
</section>

<section class="view" id="v-film">
  <svg class="heart" id="filmheart"><use href="#h"/></svg>
  <h1 id="filmtitle">YE</h1>
  <p id="filmmsg">Something I made for you. Sound on.</p>
  <button id="play" type="button">Play</button>
  <div class="bar" id="bar"><i id="barfill"></i></div>
  <video id="vid" controls playsinline></video>
</section>

<section class="view" id="v-setup">
  <h1>Offline setup</h1>
  <p class="small">Keep this open until every line is filled in.</p>
  <ul class="check" id="check"></ul>
  <p id="setupmsg" class="small"></p>
</section>

<script>
{
const TARGET = new Date(2026, 11, 3, 0, 0, 0);      // 3 December 2026, 00:00 on her phone
const PX = [109, 108, 108, 109];
const PARTS = ['film.0.bin', 'film.1.bin'];
const COLLAGE = (() => {
  let started = false;
  return async function (keyStr) {
    if (started) return;
    started = true;
    let imgs, srcs;
    try {
      const buf = new Uint8Array(await (await fetch('photos.bin')).arrayBuffer());
      const key = await crypto.subtle.importKey('raw', b64u(keyStr), 'AES-GCM', false, ['decrypt']);
      const plain = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.subarray(0, 12) }, key, buf.subarray(12)));
      const hl = new DataView(plain.buffer).getUint32(0);
      const sizes = JSON.parse(new TextDecoder().decode(plain.subarray(4, 4 + hl)));
      let o = 4 + hl;
      srcs = sizes.map(n => { const u = URL.createObjectURL(new Blob([plain.slice(o, o + n)], { type: 'image/jpeg' })); o += n; return u; });
      imgs = await Promise.all(srcs.map(u => new Promise(r => { const im = new Image(); im.onload = () => r(im); im.onerror = () => r(null); im.src = u; })));
    } catch (e) { started = false; return; }
    const ok = imgs.map((im, i) => im ? i : -1).filter(i => i >= 0);
    if (!ok.length) return;

    const cv = document.getElementById('wall'), ctx = cv.getContext('2d');
    const DPR = Math.min(2, window.devicePixelRatio || 1);
    const CELL = 172, PW = 142, PH = 168, PHOTO = 128;

    // pre-render each photo as a polaroid card (white frame, square crop)
    const cards = imgs.map(im => {
      if (!im) return null;
      const c = document.createElement('canvas');
      c.width = PW * DPR; c.height = PH * DPR;
      const g = c.getContext('2d'); g.scale(DPR, DPR);
      g.fillStyle = '#fbf7f2'; g.fillRect(0, 0, PW, PH);
      const s = Math.min(im.width, im.height), sx = (im.width - s) / 2, sy = (im.height - s) * 0.35;
      g.drawImage(im, sx, sy, s, s, (PW - PHOTO) / 2, 7, PHOTO, PHOTO);
      return c;
    });

    const hash = (i, j, k) => { let x = (i * 374761393 + j * 668265263 + k * 2147483647) | 0; x = (x ^ (x >>> 13)) * 1274126177 | 0; return ((x ^ (x >>> 16)) >>> 0) / 4294967296; };
    const N = ok.length;
    // neighbouring cells avoid repeating the same photo
    const pick = (i, j) => ok[(((i * 7 + j * 11) % N) + N) % N];

    let W = 0, H = 0;
    const size = () => { W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; };
    size(); addEventListener('resize', size);

    let ox = 0, oy = 0, ang = 0, vx = 0, vy = 0, zoom = 1;
    const SPIN = 0.045; // rad per second
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // pointer: drag to pan (with momentum), pinch to zoom, tap to open a photo
    const pts = new Map(); let lastT = 0, moved = 0, pinch0 = 0, zoom0 = 1;
    const toWorld = (dx, dy) => { const c = Math.cos(-ang), s = Math.sin(-ang); return [(dx * c - dy * s) / zoom, (dx * s + dy * c) / zoom]; };
    cv.addEventListener('pointerdown', e => {
      cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); vx = vy = 0; moved = 0; lastT = performance.now();
      if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); zoom0 = zoom; }
    });
    cv.addEventListener('pointermove', e => {
      const p = pts.get(e.pointerId); if (!p) return;
      const dx = e.clientX - p[0], dy = e.clientY - p[1];
      pts.set(e.pointerId, [e.clientX, e.clientY]);
      if (pts.size === 2) {
        const [a, b] = [...pts.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
        if (pinch0) zoom = Math.max(0.55, Math.min(2.2, zoom0 * d / pinch0)); moved += 10; return;
      }
      moved += Math.abs(dx) + Math.abs(dy);
      const [wx, wy] = toWorld(dx, dy); ox -= wx; oy -= wy;
      const now = performance.now(), dt = Math.max(8, now - lastT); lastT = now;
      vx = -wx / dt * 16; vy = -wy / dt * 16;
    });
    const up = e => {
      if (!pts.has(e.pointerId)) return;
      pts.delete(e.pointerId); if (pts.size < 2) pinch0 = 0;
      if (moved < 8 && pts.size === 0) tap(e.clientX, e.clientY);
    };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

    const lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg');
    lb.addEventListener('click', () => lb.classList.remove('on'));
    function tap(x, y) {
      const [wx, wy] = toWorld(x - W / 2, y - H / 2);
      const X = wx + ox, Y = wy + oy;
      const i = Math.floor(X / CELL), j = Math.floor(Y / CELL);
      lbimg.src = srcs[pick(i, j)];
      lb.classList.add('on');
    }

    let prev = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
      if (!reduce) ang += SPIN * dt;
      if (!pts.size) { ox += vx; oy += vy; vx *= 0.94; vy *= 0.94; if (!reduce) { ox += 9 * dt; oy += 4 * dt; } }
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.fillStyle = '#1a0d14'; ctx.fillRect(0, 0, W, H);
      ctx.translate(W / 2, H / 2); ctx.rotate(ang); ctx.scale(zoom, zoom);
      const R = Math.hypot(W, H) / 2 / zoom + CELL;
      const i0 = Math.floor((ox - R) / CELL), i1 = Math.floor((ox + R) / CELL);
      const j0 = Math.floor((oy - R) / CELL), j1 = Math.floor((oy + R) / CELL);
      for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
        const card = cards[pick(i, j)]; if (!card) continue;
        const cx = i * CELL + CELL / 2 + (hash(i, j, 1) - 0.5) * 26 - ox;
        const cy = j * CELL + CELL / 2 + (hash(i, j, 2) - 0.5) * 26 - oy;
        if (cx * cx + cy * cy > R * R) continue;
        const rot = (hash(i, j, 3) - 0.5) * 0.5;
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
        ctx.fillStyle = '#00000059'; ctx.fillRect(-PW / 2 + 4, -PH / 2 + 7, PW, PH);
        ctx.drawImage(card, -PW / 2, -PH / 2, PW, PH);
        ctx.restore();
      }
      // soft vignette so the numbers stay readable
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.15, W / 2, H / 2, Math.hypot(W, H) * 0.6);
      g.addColorStop(0, '#1a0d1440'); g.addColorStop(1, '#1a0d14b3');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      requestAnimationFrame(frame);
    }
    document.body.classList.add('collage');
    requestAnimationFrame(frame);
  };
})();
const $ = id => document.getElementById(id);
const show = v => { for (const s of document.querySelectorAll('.view')) s.classList.toggle('on', s.id === 'v-' + v); };

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

let tick = null;
function lockView() {
  clearInterval(tick);
  const step = () => {
    const ms = TARGET - new Date();
    if (ms <= 0) {
      clearInterval(tick);
      $('pin').innerHTML = PX.map(c => '<b>' + String.fromCharCode(c ^ 90) + '</b>').join('');
      show('pin');
      return;
    }
    const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    $('count').innerHTML = [d, h, m, sec].map(v => '<b>' + String(v).padStart(2, '0') + '</b>').join('<i>:</i>');
    show('wait');
  };
  step();
  tick = setInterval(step, 1000);
}

function b64u(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  return Uint8Array.from(atob(s), c => c.charCodeAt(0));
}

let filmKey = '';
async function playFilm() {
  const btn = $('play');
  btn.disabled = true; btn.textContent = 'Opening…';
  $('bar').style.display = 'block';
  try {
    const bufs = [];
    for (let i = 0; i < PARTS.length; i++) {
      const r = await fetch(PARTS[i]);
      if (!r.ok) throw new Error('missing');
      bufs.push(new Uint8Array(await r.arrayBuffer()));
      $('barfill').style.width = ((i + 1) / (PARTS.length + 1) * 100) + '%';
    }
    const all = new Uint8Array(bufs.reduce((a, b) => a + b.length, 0));
    let o = 0; for (const b of bufs) { all.set(b, o); o += b.length; }
    const key = await crypto.subtle.importKey('raw', b64u(filmKey), 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: all.subarray(0, 12) }, key, all.subarray(12));
    $('barfill').style.width = '100%';
    const v = $('vid');
    v.src = URL.createObjectURL(new Blob([plain], { type: 'video/mp4' }));
    v.style.display = 'block';
    $('bar').style.display = 'none'; btn.style.display = 'none'; $('filmheart').style.display = 'none';
    $('filmmsg').textContent = 'Sound on.';
    v.play().catch(() => {});
  } catch (e) {
    $('bar').style.display = 'none';
    btn.disabled = false; btn.textContent = 'Try again';
    $('filmmsg').textContent = "It didn't open. Scan the code inside the box again.";
  }
}
$('play').addEventListener('click', playFilm);

async function setupView() {
  show('setup');
  const files = ['./', 'photos.bin', ...PARTS];
  const list = $('check');
  list.innerHTML = '<li id="c-sw">Offline helper installed</li>' + files.map((f, i) => '<li id="c' + i + '">' + (f === './' ? 'Page' : f === 'photos.bin' ? 'Photos' : 'Video part ' + (i - 1)) + ' saved</li>').join('');
  for (let n = 0; n < 120; n++) {
    let done = 0;
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg && reg.active) { $('c-sw').className = 'ok'; done++; }
    if (window.caches) {
      for (let i = 0; i < files.length; i++) {
        if (await caches.match(files[i])) { $('c' + i).className = 'ok'; done++; }
      }
    }
    if (done === files.length + 1) {
      $('setupmsg').innerHTML = 'All saved. Now turn on Airplane Mode, close Safari and scan the outside code. You should see the countdown.';
      return;
    }
    $('setupmsg').textContent = 'Saving… keep Wi-Fi on.';
    await new Promise(r => setTimeout(r, 1000));
  }
  $('setupmsg').textContent = 'Not everything saved. Reload this page on Wi-Fi.';
}

function route() {
  const h = location.hash.slice(1);
  clearInterval(tick);
  if (h === 'lock' || h.startsWith('lock=')) { lockView(); if (h.startsWith('lock=')) COLLAGE(h.slice(5)); }
  else if (h.startsWith('film=')) {
    filmKey = h.slice(5);
    const b = $('play'); b.style.display = ''; b.disabled = false; b.textContent = 'Play';
    $('vid').style.display = 'none'; $('filmheart').style.display = ''; $('filmmsg').textContent = 'Something I made for you. Sound on.';
    show('film');
  }
  else if (h === 'setup') setupView();
  else show('home');
}
window.addEventListener('hashchange', route);
route();
}
</script>
</body>
</html>
